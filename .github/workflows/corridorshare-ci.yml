name: CorridorShare Clean Architecture CI

on:
  push:
    paths:
      - 'corridorshare/**'
      - '.github/workflows/corridorshare-ci.yml'
  pull_request:
    paths:
      - 'corridorshare/**'
      - '.github/workflows/corridorshare-ci.yml'

jobs:
  verify:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corridorshare
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run unit & widget test suite with coverage
        run: flutter test --coverage
