name: Mobile CI

on:
  push:
    paths:
      - 'corridorshare-app/**'
      - 'supabase/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'corridorshare-app/**'
      - 'supabase/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corridorshare-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
