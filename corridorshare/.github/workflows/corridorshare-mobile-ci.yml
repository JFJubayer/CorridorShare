name: CorridorShare mobile CI

on:
  push:
    paths:
      - 'corridorshare/**'
      - '.github/workflows/corridorshare-mobile-ci.yml'
  pull_request:
    paths:
      - 'corridorshare/**'
      - '.github/workflows/corridorshare-mobile-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corridorshare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localization and freezed code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
