name: corridorshare
description: "CorridorShare — peer-to-peer crowd-shipping for Bangladesh."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Models and serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Cloudinary Storage
  cloudinary_public: ^0.23.1
  flutter_dotenv: ^5.2.1

  # Localization helpers
  intl: ^0.20.2

  # Utilities
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
